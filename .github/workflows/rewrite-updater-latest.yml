name: Rewrite updater latest.json URLs

# Repair a published or draft Release whose latest.json still points at
# GitHub API asset URLs (403 for unauthenticated updater downloads).
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (e.g. v0.12.0)
        required: true
        type: string

permissions:
  contents: write

jobs:
  rewrite:
    name: Rewrite ${{ inputs.tag }} latest.json
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Rewrite latest.json asset URLs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/rewrite-updater-latest.mjs "${{ inputs.tag }}"
