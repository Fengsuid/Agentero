name: Sync release to AtomGit

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing GitHub Release tag to synchronize (for example v0.11.3)
        required: true
        type: string
  release:
    types: [published, edited]

permissions:
  # Resolving a release by tag (and judging `latest`) lists the releases
  # endpoint, where drafts only appear for tokens with push access; a
  # manual dispatch or an `edited` event can still land on a draft.
  contents: write

# Serialize tags too, so a historical backfill cannot race latest promotion.
# Never interrupt an upload to start a newer run.
concurrency:
  group: atomgit-release
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    # Every asset crosses the AtomGit link twice: once up, then back down to
    # verify its SHA-256. Pinning the overseas edge keeps that quick, but a
    # degraded route can still crawl for an hour on the 120 MB AppImage (#694),
    # so keep headroom below GitHub's 360-minute hard limit.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
        with:
          # Pushing the release tag needs its commit and ancestry, and the
          # `release` / `workflow_dispatch` events check out the default branch
          # rather than the tag itself.
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false
      - name: Pin AtomGit to its overseas edge
        env:
          # Clear the variable to go back to whatever DNS resolves.
          ATOMGIT_PROXY_IP: ${{ vars.ATOMGIT_PROXY_IP || '159.138.147.37' }}
        run: |
          set -euo pipefail
          if [ -z "${ATOMGIT_PROXY_IP}" ]; then
            echo "ATOMGIT_PROXY_IP is empty; keeping default DNS resolution"
            exit 0
          fi
          # This value is written into /etc/hosts, so accept an IPv4 literal and
          # nothing else. Bash regex, not grep: grep matches per line, so an
          # embedded newline would inject an extra hosts entry.
          if ! [[ "${ATOMGIT_PROXY_IP}" =~ ^([0-9]{1,3}\.){3}[0-9]{1,3}$ ]]; then
            echo "::warning::ATOMGIT_PROXY_IP is not an IPv4 literal; keeping default DNS resolution"
            exit 0
          fi
          # Default DNS hands runners a China-domestic address whose route
          # collapses on sustained large uploads: the 120 MB AppImage died with
          # HTTP 502 after 43 minutes while 51 MB assets next to it took 6
          # seconds (#694). Pin only hosts that answer with a certificate valid
          # for their own name, so a retired edge address degrades to today's
          # behaviour instead of breaking TLS.
          for host in api.atomgit.com file.atomgit.com file.gitcode.com atomgit.com; do
            if verified="$(curl -sS -o /dev/null --max-time 15 \
                --resolve "${host}:443:${ATOMGIT_PROXY_IP}" \
                -w '%{ssl_verify_result}' "https://${host}/")" \
              && [ "${verified}" = "0" ]; then
              echo "${ATOMGIT_PROXY_IP} ${host}" | sudo tee -a /etc/hosts >/dev/null
              echo "Pinned ${host} -> ${ATOMGIT_PROXY_IP}"
            else
              echo "::warning::AtomGit edge ${ATOMGIT_PROXY_IP} is unusable for ${host}; keeping default DNS for it"
            fi
          done
          getent hosts api.atomgit.com file.atomgit.com file.gitcode.com atomgit.com || true
      - name: Publish the release tag on AtomGit
        env:
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
          ATOMGIT_TOKEN: ${{ secrets.ATOMGIT_TOKEN }}
          ATOMGIT_REPOSITORY: ${{ vars.ATOMGIT_REPOSITORY || 'poco-ai/Agentero' }}
          ATOMGIT_GIT_HOST: ${{ vars.ATOMGIT_GIT_HOST || 'atomgit.com' }}
          ATOMGIT_GIT_USERNAME: ${{ vars.ATOMGIT_GIT_USERNAME }}
        run: |
          set -euo pipefail
          if [ -z "${ATOMGIT_TOKEN}" ] || [ -z "${RELEASE_TAG}" ]; then
            echo "::warning::Missing ATOMGIT_TOKEN or RELEASE_TAG; leaving ${RELEASE_TAG:-the tag} to the AtomGit repository mirror"
            exit 0
          fi
          # Every value below ends up in a git refspec or in a credential-bearing
          # URL, so reject anything that could be read as an option or that could
          # redirect the push to another host. Bash regex, not grep: grep matches
          # per line, so an embedded newline would smuggle a value past ^...$.
          matches() { [[ "$2" =~ ^$1$ ]]; }
          if ! matches '[A-Za-z0-9][A-Za-z0-9._-]*' "${RELEASE_TAG}"; then
            echo "::error::Refusing to push an unexpected release tag shape: ${RELEASE_TAG}"
            exit 1
          fi
          if ! matches '([A-Za-z0-9-]+\.)*atomgit\.com' "${ATOMGIT_GIT_HOST}" \
            || ! matches '[A-Za-z0-9._-]+/[A-Za-z0-9._-]+' "${ATOMGIT_REPOSITORY}"; then
            echo "::error::Invalid ATOMGIT_GIT_HOST or ATOMGIT_REPOSITORY"
            exit 1
          fi
          # Fetch only when the tag is not already local: a tag-triggered run
          # has it checked out, and re-fetching into that ref can be refused.
          # Nothing below is fatal under `set -e`: a transient git or API failure
          # must degrade to the mirror, not fail an otherwise healthy release
          # sync. waitForTag still gates the release, so the guarantee holds.
          if ! git rev-parse -q --verify "refs/tags/${RELEASE_TAG}^{commit}" >/dev/null; then
            git fetch --no-tags origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}" || {
              echo "::warning::Could not fetch ${RELEASE_TAG} from origin; leaving it to the repository mirror"
              exit 0
            }
          fi
          username="${ATOMGIT_GIT_USERNAME}"
          if [ -z "${username}" ]; then
            # The git HTTPS user is the account login, which the token can name
            # itself; no extra secret to provision. `|| true` because pipefail
            # would otherwise turn a curl failure into a failed assignment.
            username="$(curl -sS --max-time 30 \
              -H "Authorization: Bearer ${ATOMGIT_TOKEN}" \
              "https://api.atomgit.com/api/v5/user" \
              | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>{try{console.log(JSON.parse(d).login||"")}catch{console.log("")}})' \
              || true)"
          fi
          if [ -z "${username}" ]; then
            echo "::warning::Could not resolve an AtomGit git username; leaving ${RELEASE_TAG} to the repository mirror"
            exit 0
          fi
          if ! matches '[A-Za-z0-9._-]+' "${username}"; then
            echo "::error::Resolved AtomGit git username has an unexpected shape"
            exit 1
          fi
          # AtomGit neither derives a tag from a release's target_commitish nor
          # mirrors tags promptly, so POST /releases answers an opaque HTTP 400
          # while the tag is absent. Push it here instead of waiting.
          # Never --force: a remote tag already pointing elsewhere must stay put
          # and surface as a commit mismatch rather than be silently rewritten.
          # GIT_ASKPASS keeps the token out of the remote URL and of argv.
          askpass="$(mktemp)"
          printf '#!/bin/sh\nprintf "%%s\\n" "$ATOMGIT_GIT_PASSWORD"\n' > "${askpass}"
          chmod +x "${askpass}"
          trap 'rm -f "${askpass}"' EXIT
          export ATOMGIT_GIT_PASSWORD="${ATOMGIT_TOKEN}"
          export GIT_ASKPASS="${askpass}"
          export GIT_TERMINAL_PROMPT=0
          if ! pushed="$(git push "https://${username}@${ATOMGIT_GIT_HOST}/${ATOMGIT_REPOSITORY}.git" \
            "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}" 2>&1)"; then
            printf '%s\n' "${pushed}"
            # A pull-mirror rejects every push outright, so name that cause
            # instead of leaving the next operator to decode a bare HTTP 403.
            case "${pushed}" in
              *"image repository"* | *CH.00905403*)
                echo "::warning::AtomGit rejects pushes to ${ATOMGIT_REPOSITORY}: it is a pull-mirror (image) repository, so ${RELEASE_TAG} can only arrive from the mirrored upstream. Convert it to a normal repository if CI should own tags."
                ;;
              *)
                echo "::warning::Could not push ${RELEASE_TAG} to AtomGit; leaving it to the repository mirror"
                ;;
            esac
          fi
      - name: Synchronize release notes and every uploaded asset
        env:
          GH_TOKEN: ${{ github.token }}
          ATOMGIT_TOKEN: ${{ secrets.ATOMGIT_TOKEN }}
          ATOMGIT_REPOSITORY: ${{ vars.ATOMGIT_REPOSITORY || 'poco-ai/Agentero' }}
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: node scripts/sync-atomgit-release.mjs
