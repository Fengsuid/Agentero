[package]
name = "agentero-plugin-host"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
rquickjs = { version = "0.14", default-features = false, features = ["std"] }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["process", "io-util", "time", "macros", "rt"] }
tokio-util = { version = "0.7", features = ["rt"] }

[dev-dependencies]
tempfile = { workspace = true }
